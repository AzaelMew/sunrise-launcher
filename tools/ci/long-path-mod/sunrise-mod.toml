id = "wpm"
name = "Path Probe"
version = "0.1.0"
description = "CI's Windows build: a mixin-only native mod, so the build links the patch library."
authors = []
api = "0.2"
side = "client"

[native]
game = "26.3"
sunrise = "94256510f74e6843754e0a93fd9e4da7e45b1056"

# Replaces the darkness fog's result with itself: a patch only, so the build links `sunrise_patch`.
[[native.mixin]]
id = "darkness_fog"
target = "sunrise_client::game::sculk::Game<'_>::darkness_fog"
kind = "RETURN"
helper = "src/mixins/darkness_fog.rs"
bindings = [{ name = "value", ty = "Option<f32>", value = "$value" }]
