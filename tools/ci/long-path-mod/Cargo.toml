[package]
name = "mod-wpm"
version = "0.1.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command. Any other
# registry dependency is pinned in Cargo.lock by `cargo sunrise-mod build`.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
# A registry crate, exact, so the SDK builds the mod through Cargo's target folder, the route
# whose paths are deepest (#396).
itoa = "=1.0.15"
