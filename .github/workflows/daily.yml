name: daily
# Daily and by hand: the ignored tests on Linux and Windows, except the ones tools/ci/manual-tests.txt lists.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUNRISE_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: always

jobs:
  ignored:
    name: ignored tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux headers GPUI links against
        if: runner.os == 'Linux'
        run: >-
          bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: daily-${{ matrix.name }}
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
      - name: The holder test's actor (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked -p sunrise-launcher-smod --example holder_actor
      - name: Ignored tests, the manual ones skipped
        run: |
          skip=()
          while read -r _ test _; do skip+=(--skip "$test"); done < <(grep -v '^#' tools/ci/manual-tests.txt | grep .)
          cargo test --locked --workspace --no-fail-fast -- --ignored "${skip[@]}"
