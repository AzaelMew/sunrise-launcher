name: daily
# Daily and by hand: the ignored tests on Linux and Windows, except the ones tools/ci/manual-tests.txt lists.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force_hosted:
        description: Run on GitHub's runners even while Dyna's pool is leased
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUNRISE_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: always

jobs:
  # Dyna's runners take dispatches, not scheduled events: the schedule only dispatches this workflow on main.
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml -R "$GITHUB_REPOSITORY" --ref main

  # Linux on Dyna's pool while SUNRISE_LAUNCHER_CI_RUNNER names it and its lease (DYNA_CI_POOL_UNTIL, Unix seconds) holds; only a maintainer dispatches this.
  route:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      runner: ${{ steps.pool.outputs.runner }}
    steps:
      - id: pool
        env:
          FORCE_HOSTED: ${{ inputs.force_hosted }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          POOL: ${{ vars.SUNRISE_LAUNCHER_CI_RUNNER }}
        run: |
          runner=ubuntu-24.04
          if [[ "$FORCE_HOSTED" != true && -n "$POOL" && "$LEASE" =~ ^[0-9]{1,12}$ ]] && [ "$LEASE" -gt "$(date +%s)" ]; then
            runner=$POOL
          fi
          # Hosted is the agreed fallback, but a trusted run says why it left the pool.
          if [[ "$runner" != "$POOL" && "$FORCE_HOSTED" != true ]]; then
            if [[ -z "$POOL" ]]; then why="vars.SUNRISE_LAUNCHER_CI_RUNNER is unset"
            elif [[ ! "$LEASE" =~ ^[0-9]{1,12}$ ]]; then why="vars.DYNA_CI_POOL_UNTIL is unset or not Unix seconds"
            else why="Dyna's lease ran out at $(date -u -d "@$LEASE" +%FT%TZ)"; fi
            echo "::warning title=Linux on GitHub's runner::$why, so Linux runs on ubuntu-24.04"
          fi
          echo "runner=$runner" | tee -a "$GITHUB_OUTPUT"

  ignored:
    name: ignored tests (${{ matrix.name }})
    needs: route
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-24.04 }
          - { name: windows, os: windows-latest, targets: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.name == 'linux' && needs.route.outputs.runner || matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dyna's runners carry these headers and Rust's caches already.
      - name: Linux headers GPUI links against
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: >-
          bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
          libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          shared-key: daily-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
      - name: The holder test's actor (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked -p sunrise-launcher-smod --example holder_actor
      - name: Ignored tests, the manual ones skipped
        run: |
          skip=()
          while read -r _ test _; do skip+=(--skip "$test"); done < <(grep -v '^#' tools/ci/manual-tests.txt | grep .)
          cargo test --locked --workspace --no-fail-fast -- --ignored "${skip[@]}"

  # The tests/ targets that start the launcher on Windows, and the 1 MiB stack test by name, as the game repository's launcher-windows-check did.
  processes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: daily-processes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Keep the tests away from this runner's own folders
        run: |
          for name in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME SUNRISE_LAUNCHER_TRASH SUNRISE_LAUNCHER_CLIPBOARD SUNRISE_LAUNCHER_DESKTOP; do
            path="${RUNNER_TEMP//\\//}/launcher-isolation/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
      - name: The tests/ targets that start the launcher
        run: >-
          cargo test --no-fail-fast --locked --test desktop --test hidden_processes --test logs
          --test owner_gate --test startup --test storage
      - name: The 1 MiB process stack test, by name
        run: cargo test --locked --test startup cli_settings_work_with_one_mib_process_stack -- --ignored --exact
