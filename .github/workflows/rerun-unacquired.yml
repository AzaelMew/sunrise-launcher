name: Re-run unacquired jobs
# GitHub cancels a hosted job it can't give a runner within about 15 minutes ("The job was not acquired by Runner of
# type hosted"), macOS arm64 most often, and `build` then fails a pull request whose code never ran. This re-runs that
# CI run's failed jobs, so a slow hosted queue is waited out (tools/ci/rerun_unacquired.py). It runs no code of the
# run it looks at.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      # The script comes from main, never from the run's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/ci/rerun_unacquired.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 tools/ci/rerun_unacquired.py "$RUN" "$ATTEMPT"
