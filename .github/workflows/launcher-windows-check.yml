name: launcher-windows-check
# The launcher's tests on Windows x64, in the daily run (daily.yml calls this workflow with a commit) and by dispatch.
# Nothing is published: the release workflow (launcher.yml) stays off. Windows needs GitHub's runners, and the gate
# never waits on them (root, 2026-11-16), so no push, pull request, rollup or sync starts it; a Windows red becomes a
# daily issue like any other leg's.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A daily run's call is grouped by that run.
  group: launcher-windows-check-${{ inputs.commit && github.run_id || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    # The daily run's call (it passes a commit) and a hand dispatch.
    if: inputs.commit != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          # The launcher builds native mods for windows-gnu (rust_toolchain::WINDOWS_X64_TARGET), and
          # registry_compile's tests emit metadata for it: the image's stable had its std, a fresh pin does not.
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows-check
          # One cache, from main's daily run.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Debug builds: no launcher test depends on a release-only path (cfg!(debug_assertions) gates only the
      # self-update switch and development overrides, which no test reaches), and debug adds overflow checks.
      - run: "cargo test --no-fail-fast --locked -p sunrise-mod-package --features runtime-process --lib output::"
        working-directory: .
      # The library, the binary's own tests, the docs, and the tests/ targets that start no process.
      # Targets that start the debug launcher binary run in the daily launcher-processes job.
      - run: >-
          cargo test --no-fail-fast --locked --lib --bins --test developer_install --test durable_publication
          --test modpack_headline --test storage_consent
      - run: cargo test --no-fail-fast --locked --doc

  runtime-leases:
    # The daily run's call (scheduled or dispatched; it passes a commit) and a hand dispatch: it starts child
    # processes, so it is a daily test.
    if: inputs.commit != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: runtime-leases-windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p sunrise-mod-package --features runtime-process --example holder_actor
        working-directory: .
        shell: bash
      - run: cargo test --no-fail-fast --release --locked -p sunrise-mod-package --features runtime-process --lib
        working-directory: .
        shell: bash
      # The package's daily tests (its rows in tools/ci/ignored-tests/, the ones that start processes among them) run
      # here on Windows too, by name: no other ignored test (a manual one, a fixture writer) runs.
      - name: The package's daily tests
        working-directory: .
        shell: bash
        # bash -eo pipefail: a failure of the policy reader fails the step, never an empty selection.
        run: |
          listed=$(python tools/ci/ignored_tests.py --daily-tests sunrise-mod-package lib | tr -d '\r')
          if [ -z "$listed" ]; then
            echo "sunrise-mod-package's library has no daily rows: nothing to run"
            exit 0
          fi
          mapfile -t tests <<< "$listed"
          cargo test --no-fail-fast --release --locked -p sunrise-mod-package --features runtime-process --lib \
            -- --ignored --exact "${tests[@]}"

  launcher-processes:
    # The tests/ targets that start the debug launcher binary (the test job runs every other target).
    # Daily run and hand dispatch only: no test-runner stack override or release-only workaround.
    if: inputs.commit != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo test --no-fail-fast --locked --test desktop --test hidden_processes --test logs
          --test owner_gate --test startup --test storage
      - run: >-
          cargo test --locked --test startup cli_settings_work_with_one_mib_process_stack
          -- --ignored --exact
